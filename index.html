<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
<title>Home Display Concept v4</title>
<style>
:root{--ink:#fff;--ink-2:rgba(255,255,255,.72);--ink-3:rgba(255,255,255,.45);--glass:rgba(255,255,255,.14);--rim:rgba(255,255,255,.6);--rim-soft:rgba(255,255,255,.16);--blur:30px;--radius:28px;--accent:#ffffff;--wght:600;--spring:cubic-bezier(.34,1.25,.64,1);--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#101224}
body{font-family:'Inter','Noto Sans JP',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#wall{position:fixed;inset:0;background:radial-gradient(70% 60% at 18% 22%,#5a6bff 0%,transparent 62%),radial-gradient(60% 60% at 88% 78%,#ff7fa6 0%,transparent 64%),radial-gradient(55% 55% at 72% 12%,#3fd6c6 0%,transparent 60%),radial-gradient(50% 50% at 30% 90%,#ffb86b 0%,transparent 60%),#15172e}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}

/* Liquid glass: blur + saturation + rim light + soft specular sheen */
.glass{position:relative;border-radius:var(--radius);background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(180%) brightness(1.05);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%) brightness(1.05);box-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim-soft),inset 1px 0 0 var(--rim-soft),inset -1px 0 0 var(--rim-soft),0 10px 30px rgba(0,0,0,.2)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 68%,rgba(255,255,255,.10))}

#track{position:fixed;inset:0;width:200vw;display:flex;will-change:transform}
.face{width:100vw;height:100%;display:flex;align-items:center;justify-content:center;position:relative}

/* ===== Face 1: the clock, and nothing else ===== */
#clock{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:var(--wght);font-family:ui-rounded,'Inter','Noto Sans JP',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em;text-shadow:0 8px 40px rgba(0,0,0,.25)}
#clock.stacked{flex-direction:column;font-size:min(42vh,32vw);line-height:.84}
#clock.stacked .colon{display:none}
#clock.inline{flex-direction:row;font-size:min(32vh,21vw);line-height:1}
#clock.inline .colon{opacity:.6;padding:0 .02em;transform:translateY(-.04em)}
body[data-layout='analog'] #clock{display:none}
body:not([data-layout='analog']) #analog{display:none}
#analog{--radius:50%;width:min(80vh,72vw);height:min(80vh,72vw)}
.tick{position:absolute;left:50%;top:0;height:50%;width:2px;margin-left:-1px;transform-origin:50% 100%}
.tick::before{content:'';display:block;width:100%;height:4%;margin-top:3%;border-radius:2px;background:var(--ink-3)}
.tick.big{width:4px;margin-left:-2px}
.tick.big::before{height:7%;background:var(--ink)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:6px;background:var(--ink)}
#h-h{width:8px;height:24%;margin-left:-4px}
#h-m{width:6px;height:36%;margin-left:-3px}
#h-s{width:2px;height:41%;margin-left:-1px;background:var(--accent)}
.pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent)}

/* ===== Face 2: apps + widgets, and nothing else ===== */
#apps{flex-direction:column;gap:26px;padding:28px 40px}
.wrow{display:flex;gap:14px;width:min(760px,92vw)}
.widget{flex:1;padding:18px;min-height:128px}
.widget h4{font-size:13px;font-weight:500;color:var(--ink-2)}
.widget .big{font-size:34px;font-weight:300;margin-top:8px}
.widget .small{font-size:14px;color:var(--ink-2);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;width:min(760px,92vw)}
.app{aspect-ratio:1;border-radius:22.5%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px rgba(0,0,0,.22);transition:transform .35s var(--spring)}
.app:active{transform:scale(.9)}
.g1{background:linear-gradient(135deg,#ff5f6d,#ffc371)}.g2{background:linear-gradient(135deg,#43e97b,#38f9d7)}.g3{background:linear-gradient(135deg,#4facfe,#00f2fe)}.g4{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}.g5{background:linear-gradient(135deg,#f6d365,#fda085)}

#dots{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:transform .4s var(--spring),background .3s}
#dots i.on{background:#fff;transform:scale(1.3)}
#hint{position:fixed;bottom:34px;left:0;right:0;text-align:center;font-size:13px;color:var(--ink-3);transition:opacity 1s;pointer-events:none}

/* ===== Control Center (top-right swipe only) ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:60}
#scrim.open{opacity:1;pointer-events:auto}
#cc{position:fixed;top:14px;right:14px;width:min(400px,48vw);padding:16px;--radius:38px;display:grid;grid-template-columns:1fr 1fr;gap:12px;transform:translate3d(0,calc(-100% - 40px),0) scale(.94);transform-origin:100% 0;transition:transform .5s var(--spring);z-index:61}
#cc.open{transform:none}
.tile{border-radius:26px;padding:14px;background:var(--glass);box-shadow:inset 0 1px 0 var(--rim-soft);min-height:84px;display:flex;flex-direction:column;justify-content:space-between;transition:background .25s,transform .3s var(--spring)}
.tile.wide{grid-column:span 2}
.tile h5{font-size:12px;font-weight:500;color:var(--ink-2)}
.tile .v{font-size:15px;font-weight:600}
.tile.tog:active{transform:scale(.96)}
.tile.tog.on{background:rgba(255,255,255,.86);color:#222}
.tile.tog.on h5{color:rgba(0,0,0,.55)}
.slider{position:relative;height:56px;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 var(--rim-soft);margin-top:8px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;width:60%;background:rgba(255,255,255,.88)}
.grab{grid-column:span 2;width:44px;height:5px;border-radius:3px;background:var(--rim);margin:0 auto 4px;opacity:.7}

/* ===== Face editor (long-press the clock) ===== */
#sheet{position:fixed;left:50%;bottom:18px;width:min(560px,92vw);padding:18px;--radius:34px;transform:translate3d(-50%,calc(100% + 40px),0);transition:transform .5s var(--spring);z-index:61}
#sheet.open{transform:translate3d(-50%,0,0)}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
.row label{font-size:13px;color:var(--ink-2);min-width:64px}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:16px;padding:3px;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:9px 0;border-radius:13px;transition:background .25s}
.seg button.on{background:rgba(255,255,255,.88);color:#222}
.sw{display:flex;gap:12px;flex:1;justify-content:flex-end}
.sw i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 2px transparent;transition:box-shadow .25s}
.sw i.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 3px rgba(255,255,255,.9)}
</style>
</head>
<body data-layout='stacked'>
<div id='wall'></div>

<div id='track'>
  <section class='face' id='f0'>
    <div id='clock' class='stacked'><span id='c1'>18</span><span class='colon'>:</span><span id='c2'>00</span></div>
    <div id='analog' class='glass'></div>
  </section>
  <section class='face' id='apps'>
    <div class='wrow'>
      <div class='widget glass'><h4>天気</h4><div class='big'>18°</div><div class='small'>晴れ</div></div>
      <div class='widget glass'><h4>再生中</h4><div class='big' style='font-size:22px'>♪ Sample Song</div><div class='small'>Sample Artist</div></div>
      <div class='widget glass'><h4>PC連携</h4><div class='big' style='font-size:22px'>接続中</div><div class='small'>Windows PC</div></div>
    </div>
    <div class='grid'>
      <div class='app g1'>♪</div><div class='app g2'>☎</div><div class='app g3'>⌂</div><div class='app g4'>✉</div><div class='app g5'>⚙</div>
      <div class='app g3'>☀</div><div class='app g5'>✎</div><div class='app g1'>▶</div><div class='app g4'>★</div><div class='app g2'>⏰</div>
    </div>
  </section>
</div>

<div id='dots'><i class='on'></i><i></i></div>
<div id='hint'>長押しでカスタマイズ</div>
<div id='scrim'></div>

<div id='cc' class='glass'>
  <div class='grab'></div>
  <div class='tile wide'><h5>明るさ</h5><div class='slider' id='sl-b'><div class='fill' style='width:80%'></div></div></div>
  <div class='tile wide'><h5>音量</h5><div class='slider' id='sl-v'><div class='fill' style='width:40%'></div></div></div>
  <div class='tile tog on'><h5>Wi-Fi</h5><div class='v'>オン</div></div>
  <div class='tile tog'><h5>おやすみ</h5><div class='v'>オフ</div></div>
  <div class='tile tog on'><h5>PC連携</h5><div class='v'>オン</div></div>
  <div class='tile tog'><h5>インターホン</h5><div class='v'>オフ</div></div>
</div>

<div id='sheet' class='glass'>
  <div class='row'><label>レイアウト</label><div class='seg' data-k='layout'><button data-v='stacked' class='on'>縦</button><button data-v='inline'>横</button><button data-v='analog'>アナログ</button></div></div>
  <div class='row'><label>太さ</label><div class='seg' data-k='wght'><button data-v='300'>細</button><button data-v='600' class='on'>標準</button><button data-v='800'>太</button></div></div>
  <div class='row'><label>色</label><div class='sw'><i data-c='#ffffff' class='on' style='background:#ffffff'></i><i data-c='#ffb38a' style='background:#ffb38a'></i><i data-c='#8ff0d0' style='background:#8ff0d0'></i><i data-c='#9cc8ff' style='background:#9cc8ff'></i><i data-c='#ffa6c9' style='background:#ffa6c9'></i></div></div>
</div>

<div id='dim'></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var track=$('#track'),cc=$('#cc'),scrim=$('#scrim'),sheet=$('#sheet'),dots=document.querySelectorAll('#dots i');
  var index=0,start=null,dragging=false;
  function W(){return innerWidth}
  function setTrack(px,anim){track.style.transition=anim?'transform .6s var(--spring)':'none';track.style.transform='translate3d('+px+'px,0,0)'}
  function go(i){index=Math.max(0,Math.min(1,i));setTrack(-index*W(),true);for(var k=0;k<dots.length;k++)dots[k].classList.toggle('on',k===index)}
  window.addEventListener('resize',function(){setTrack(-index*W(),false)});
  document.addEventListener('contextmenu',function(e){e.preventDefault()});

  /* analog clock parts */
  var an=$('#analog'),i;
  for(i=0;i<60;i++){var t=document.createElement('div');t.className='tick'+(i%5?'':' big');t.style.transform='rotate('+(i*6)+'deg)';an.appendChild(t)}
  var hh=document.createElement('div'),hm=document.createElement('div'),hs=document.createElement('div'),pin=document.createElement('div');
  hh.id='h-h';hm.id='h-m';hs.id='h-s';hh.className=hm.className=hs.className='hand';pin.className='pin';
  an.appendChild(hh);an.appendChild(hm);an.appendChild(hs);an.appendChild(pin);

  function pad(n){return n<10?'0'+n:''+n}
  function tick(){
    var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
    $('#c1').textContent=pad(h);$('#c2').textContent=pad(m);
    hh.style.transform='rotate('+((h%12)*30+m*.5)+'deg)';
    hm.style.transform='rotate('+(m*6+s*.1)+'deg)';
    hs.style.transform='rotate('+(s*6)+'deg)';
  }
  tick();setInterval(tick,1000);

  /* overlays */
  function openCC(){cc.classList.add('open');scrim.classList.add('open')}
  function openSheet(){sheet.classList.add('open');scrim.classList.add('open')}
  function closeAll(){cc.classList.remove('open');sheet.classList.remove('open');scrim.classList.remove('open')}
  function overlay(){return cc.classList.contains('open')||sheet.classList.contains('open')}

  /* gestures
     - swipe down from TOP-RIGHT zone -> Control Center
     - swipe left/right               -> switch screen (finger-following, rubber band)
     - swipe up from bottom edge      -> apps screen
     - long-press on the clock        -> face editor */
  function rub(dx){return((index===0&&dx>0)||(index===1&&dx<0))?dx*.3:dx}
  window.addEventListener('pointerdown',function(e){
    var x=e.clientX,y=e.clientY;
    if(overlay()){start={x:x,y:y,kind:'close',t:Date.now()};return}
    var kind='side';
    if(x>innerWidth*.7&&y<innerHeight*.18)kind='cc';
    else if(y>innerHeight*.85)kind='bottom';
    start={x:x,y:y,kind:kind,t:Date.now(),lp:null};
    if(kind==='side'&&index===0){start.lp=setTimeout(function(){if(start&&!dragging){openSheet();start=null}},550)}
  });
  window.addEventListener('pointermove',function(e){
    if(!start)return;
    var dx=e.clientX-start.x,dy=e.clientY-start.y,ax=Math.abs(dx),ay=Math.abs(dy);
    if(start.lp&&(ax>10||ay>10)){clearTimeout(start.lp);start.lp=null}
    if(start.kind==='cc'){if(dy>50&&ay>ax){openCC();start=null}}
    else if(start.kind==='close'){
      if(cc.classList.contains('open')&&dy<-50&&ay>ax){closeAll();start=null}
      else if(sheet.classList.contains('open')&&dy>50&&ay>ax){closeAll();start=null}
    }
    else if(start.kind==='bottom'){if(dy<-50&&ay>ax){go(1);start=null}}
    else if(start.kind==='side'){
      if(!dragging&&ax>12&&ax>ay)dragging=true;
      if(dragging)setTrack(-index*W()+rub(dx),false);
    }
  });
  window.addEventListener('pointerup',function(e){
    if(start){
      if(start.lp)clearTimeout(start.lp);
      if(start.kind==='close'&&e.target===scrim)closeAll();
      if(dragging){
        var dx=e.clientX-start.x,v=Math.abs(dx)/Math.max(1,Date.now()-start.t);
        if(Math.abs(dx)>W()*.2||v>.5)go(index+(dx<0?1:-1));else go(index);
      }
    }
    dragging=false;start=null;
  });
  window.addEventListener('pointercancel',function(){if(dragging)go(index);dragging=false;start=null});

  /* sliders */
  function slider(el,cb){
    var f=el.querySelector('.fill');
    function set(e){var r=el.getBoundingClientRect();var v=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));f.style.width=(v*100)+'%';cb(v)}
    el.addEventListener('pointerdown',function(e){e.stopPropagation();el.setPointerCapture(e.pointerId);set(e);el.onpointermove=set});
    el.addEventListener('pointerup',function(){el.onpointermove=null});
  }
  slider($('#sl-b'),function(v){$('#dim').style.opacity=(1-v)*.65});
  slider($('#sl-v'),function(){});
  $('#dim').style.opacity=.13;

  /* toggles */
  var tg=document.querySelectorAll('.tog');
  for(i=0;i<tg.length;i++)(function(el){el.addEventListener('click',function(){var on=el.classList.toggle('on');el.querySelector('.v').textContent=on?'オン':'オフ'})})(tg[i]);

  /* face editor */
  function setLayout(v){document.body.setAttribute('data-layout',v);if(v!=='analog')$('#clock').className=v}
  var segs=document.querySelectorAll('.seg');
  for(i=0;i<segs.length;i++)(function(seg){
    var bs=seg.querySelectorAll('button');
    for(var j=0;j<bs.length;j++)(function(b){b.addEventListener('click',function(){
      for(var k=0;k<bs.length;k++)bs[k].classList.remove('on');b.classList.add('on');
      if(seg.getAttribute('data-k')==='layout')setLayout(b.getAttribute('data-v'));
      else document.documentElement.style.setProperty('--wght',b.getAttribute('data-v'));
    })})(bs[j]);
  })(segs[i]);
  var sw=document.querySelectorAll('.sw i');
  for(i=0;i<sw.length;i++)(function(el){el.addEventListener('click',function(){
    for(var k=0;k<sw.length;k++)sw[k].classList.remove('on');el.classList.add('on');
    document.documentElement.style.setProperty('--accent',el.getAttribute('data-c'));
  })})(sw[i]);

  setTimeout(function(){$('#hint').style.opacity=0},5000);
})();
</script>
</body>
</html>
