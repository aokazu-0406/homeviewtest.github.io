<!DOCTYPE html>
<html lang='ja' data-theme='light'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no'>
<title>Home Display Concept v6</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@600;800;900&display=swap' rel='stylesheet'>
<style>
:root{--ink:#171a33;--ink-2:rgba(23,26,51,.66);--ink-3:rgba(23,26,51,.4);--tint:rgba(255,255,255,.1);--shade:rgba(34,40,84,.16);--on-bg:rgba(23,26,51,.86);--on-ink:#fff;--track:rgba(23,26,51,.12);--fill:#fff;--bri:.99;--w1:rgba(255,255,255,.3);--w2:rgba(255,255,255,.04);--w3:rgba(30,38,80,.08);--clk-edge:rgba(20,26,60,.42);--wght:700;--cf:'Inter','Noto Sans JP',system-ui,sans-serif;--spring:cubic-bezier(.34,1.25,.64,1);--ease:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme='dark']{--ink:#fff;--ink-2:rgba(255,255,255,.72);--ink-3:rgba(255,255,255,.42);--tint:rgba(255,255,255,.12);--shade:rgba(0,0,0,.38);--on-bg:rgba(255,255,255,.9);--on-ink:#1b1b20;--track:rgba(255,255,255,.16);--fill:rgba(255,255,255,.92);--bri:1.08;--w1:rgba(255,255,255,.28);--w2:rgba(255,255,255,.06);--w3:rgba(255,255,255,.12);--clk-edge:rgba(255,255,255,.5)}
body[data-font='round']{--cf:'Nunito','Noto Sans JP',ui-rounded,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#dfe3ea}
body{font-family:'Inter','Noto Sans JP',system-ui,sans-serif;color:var(--ink);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#wp{position:fixed;left:-4vw;top:0;width:108vw;height:100%;object-fit:cover;pointer-events:none}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}

/* ===== Liquid Glass: live blur + saturation, bright rim that fades around the edge, moving specular, inner glow ===== */
.lg{position:relative;isolation:isolate;border-radius:var(--r,28px);background:linear-gradient(160deg,rgba(255,255,255,.34),var(--tint) 45%,rgba(255,255,255,.1));-webkit-backdrop-filter:blur(16px) saturate(1.9) brightness(var(--bri));backdrop-filter:blur(16px) saturate(1.9) brightness(var(--bri));box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -1px 1px rgba(255,255,255,.3),inset 0 0 18px rgba(255,255,255,.22),0 1px 3px rgba(0,0,0,.06),0 18px 40px var(--shade)}
.lg::before,.app::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 70% at var(--mx,18%) var(--my,0%),rgba(255,255,255,.5),transparent 60%),linear-gradient(150deg,rgba(255,255,255,.28),transparent 30%,transparent 70%,rgba(255,255,255,.16));opacity:.85;transition:opacity .3s}
.lg::after,.app::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;background:conic-gradient(from 200deg,rgba(255,255,255,.95),rgba(255,255,255,.12) 22%,rgba(255,255,255,.6) 48%,rgba(255,255,255,.1) 72%,rgba(255,255,255,.95));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.press{transform:scale(.965)}
.press::before{opacity:1}
.widget,.tile,.app{transition:transform .45s var(--spring)}

#track{position:fixed;inset:0;width:200vw;display:flex;will-change:transform}
.face{width:100vw;height:100%;display:flex;align-items:center;justify-content:center;position:relative}

/* ===== Face 1: the clock, and nothing else ===== */
#clock{display:flex;align-items:center;justify-content:center;font-family:var(--cf);font-weight:var(--wght);font-variant-numeric:tabular-nums;letter-spacing:-.045em;color:transparent;background-image:linear-gradient(180deg,var(--w1),var(--w2) 55%,var(--w3)),var(--wpimg,none);background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8)) drop-shadow(0 -1px 0 var(--clk-edge)) drop-shadow(0 0 1px var(--clk-edge)) drop-shadow(0 22px 36px var(--shade))}
#clock.stacked{flex-direction:column;font-size:min(40vh,30vw);line-height:.8}
#clock.stacked .colon{display:none}
#clock.inline{flex-direction:row;font-size:min(32vh,21vw);line-height:1}
#clock.inline .colon{opacity:.55;padding:0 .03em;transform:translateY(-.05em)}
body[data-layout='analog'] #clock{display:none}
body:not([data-layout='analog']) #analog{display:none}
#analog{position:relative;width:min(80vh,72vw);height:min(80vh,72vw)}
.tick{position:absolute;left:50%;top:0;height:50%;width:2px;margin-left:-1px;transform-origin:50% 100%}
.tick::before{content:'';display:block;width:100%;height:3.6%;border-radius:2px;background:var(--ink-3)}
.tick.big{width:4px;margin-left:-2px}
.tick.big::before{height:6.5%;background:var(--ink)}
.num{position:absolute;transform:translate(-50%,-50%);font-family:var(--cf);font-weight:var(--wght);font-size:min(7.5vh,6vw);color:var(--ink)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:6px;background:var(--ink)}
#h-h{width:9px;height:25%;margin-left:-4.5px}
#h-m{width:6px;height:37%;margin-left:-3px}
#h-s{width:2px;height:41%;margin-left:-1px;background:#ff9f0a}
.pin{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#ff9f0a}

/* ===== Face 2: widgets + apps + dock, and nothing else ===== */
#apps{flex-direction:column;justify-content:center;gap:4.5vh;padding:4vh 5vw 16vh}
.wrow{display:flex;gap:16px;width:min(900px,90vw)}
.widget{flex:1;padding:20px 22px;min-height:min(22vh,150px);--r:30px}
.widget h4{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.widget .big{font-size:44px;font-weight:700;letter-spacing:-.03em;margin-top:10px;line-height:1}
.widget .small{font-size:14px;font-weight:500;color:var(--ink-2);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;width:min(900px,90vw)}
.ai{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink)}
.app{position:relative;isolation:isolate;filter:saturate(.7);width:min(11vh,84px);aspect-ratio:1;border-radius:22.4%;background:linear-gradient(160deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 2px rgba(0,0,0,.12),0 8px 20px var(--shade)}
.app svg{position:relative;z-index:1;width:52%;height:52%;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
#dock{position:absolute;left:50%;bottom:calc(6.5vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:18px;padding:12px 16px;--r:34px}
#dock .app{width:min(9.4vh,72px)}

#dots{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);transition:transform .4s var(--spring),background .3s}
#dots i.on{background:var(--ink);transform:scale(1.3)}
#hint{position:fixed;bottom:calc(34px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;font-weight:500;color:var(--ink-3);transition:opacity 1s;pointer-events:none}

/* ===== Control Center (top-right swipe only) ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:60}
#scrim.open{opacity:1;pointer-events:auto}
#cc{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:min(400px,48vw);padding:16px;--r:38px;display:grid;grid-template-columns:1fr 1fr;gap:12px;transform:translate3d(0,calc(-100% - 60px),0) scale(.94);transform-origin:100% 0;transition:transform .5s var(--spring);z-index:61}
#cc.open{transform:none}
.tile{position:relative;border-radius:26px;padding:14px;background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.12));box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 0 12px rgba(255,255,255,.18);min-height:84px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.tile.wide{grid-column:span 2}
.tile h5{font-size:12px;font-weight:500;color:var(--ink-2)}
.tile .v{font-size:15px;font-weight:600}
.tile.tog.on{background:var(--on-bg);color:var(--on-ink)}
.tile.tog.on h5{color:var(--on-ink);opacity:.65}
.slider{position:relative;height:56px;border-radius:28px;overflow:hidden;background:var(--track);box-shadow:inset 0 1px 2px rgba(0,0,0,.08);margin-top:8px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;width:60%;background:var(--fill);box-shadow:0 0 10px rgba(0,0,0,.12)}
.grab{grid-column:span 2;width:44px;height:5px;border-radius:3px;background:var(--ink-3);margin:0 auto 4px}

/* ===== Face editor (long-press the clock) ===== */
#sheet{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(560px,92vw);padding:18px;--r:34px;transform:translate3d(-50%,calc(100% + 60px),0);transition:transform .5s var(--spring);z-index:61}
#sheet.open{transform:translate3d(-50%,0,0)}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
.row label{font-size:13px;font-weight:500;color:var(--ink-2);min-width:64px}
.seg{display:flex;background:var(--track);border-radius:16px;padding:3px;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:9px 0;border-radius:13px;transition:background .25s}
.seg button.on{background:var(--on-bg);color:var(--on-ink)}
.sw{display:flex;gap:12px;flex:1;justify-content:flex-end}
.sw i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 0 0 2px transparent;transition:box-shadow .25s}
.sw i.on{box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 0 0 3px var(--ink)}
</style>
</head>

  if(wp.complete){theme();align()}else wp.onload=function(){theme();align()};

  function W(){return innerWidth}
  /* clock numerals show the wallpaper itself (lifted slightly), so they read as clear glass */
  var wpSet=false;
  function align(){
    if(!wp.naturalWidth)return;
    var cr=clock.getBoundingClientRect(),wr=wp.getBoundingClientRect(),w=wp.clientWidth,h=wp.clientHeight,s=Math.max(w/wp.naturalWidth,h/wp.naturalHeight),dw=wp.naturalWidth*s,dh=wp.naturalHeight*s;
    if(!wpSet){clock.style.setProperty('--wpimg','url('+wp.src+')');wpSet=true}
    clock.style.backgroundSize='auto,'+dw+'px '+dh+'px';
    clock.style.backgroundPosition='0 0,'+(wr.left+(w-dw)/2-cr.left)+'px '+(wr.top+(h-dh)/2-cr.top)+'px';
  }
  function loop(){align();if(Date.now()<until)requestAnimationFrame(loop)}
  function setTrack(px,anim){
    var tr=anim?'transform .6s var(--spring)':'none';
    track.style.transition=tr;track.style.transform='translate3d('+px+'px,0,0)';
    wp.style.transition=tr;wp.style.transform='translate3d('+(px/W()*3)+'vw,0,0)';
    if(anim){until=Date.now()+750;loop()}else align();
  }
  function go(n){index=Math.max(0,Math.min(1,n));setTrack(-index*W(),true);for(var k=0;k<dots.length;k++)dots[k].classList.toggle('on',k===index)}
  window.addEventListener('resize',function(){setTrack(-index*W(),false)});
  document.addEventListener('contextmenu',function(e){e.preventDefault()});

  /* original line glyphs on a 24px grid */
  var G={
    music:['M9 18V6l10-2v12','M9 18a2.5 2.5 0 1 1-5 0a2.5 2.5 0 0 1 5 0z','M19 16a2.5 2.5 0 1 1-5 0a2.5 2.5 0 0 1 5 0z'],
    phone:['M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z'],
    home:['M4 11l8-7 8 7v9H4z','M10 20v-6h4v6'],
    mail:['M5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-9A2.5 2.5 0 0 1 5.5 5z','M3.5 7.5l8.5 6 8.5-6'],
    sliders:['M4 8h9','M17 8h3','M4 16h3','M11 16h9','M15 8m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0','M9 16m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0'],
    sun:['M12 8a4 4 0 1 1 0 8a4 4 0 0 1 0-8z','M12 2.5v2.5','M12 19v2.5','M2.5 12H5','M19 12h2.5','M5.3 5.3l1.8 1.8','M16.9 16.9l1.8 1.8','M5.3 18.7l1.8-1.8','M16.9 7.1l1.8-1.8'],
    note:['M5 19l1-4L17 4l3 3L9 18z','M15 6l3 3'],
    play:['M8 5l11 7-11 7z'],
    photo:['M6 4h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z','M4 18l5-5 4 4 3-3 4 4'],
    clock:['M12 3a9 9 0 1 1 0 18a9 9 0 0 1 0-18z','M12 7v5l3 2']
  };
  function svg(g){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');G[g].forEach(function(d){var p=document.createElementNS(NS,'path');p.setAttribute('d',d);s.appendChild(p)});return s}
  function mk(def,labeled){
    var w=document.createElement('div');w.className='ai';
    var ic=document.createElement('div');ic.className='app';ic.style.setProperty('--a',def[2]);ic.style.setProperty('--b',def[3]);ic.appendChild(svg(def[0]));w.appendChild(ic);
    if(labeled){var t=document.createElement('span');t.textContent=def[1];w.appendChild(t)}
    return w;
  }
  var gridApps=[['home','ホーム','#ffb340','#ff8a00'],['sun','天気','#5ac8fa','#2f7fe0'],['note','メモ','#ffe066','#f2b900'],['play','動画','#9b7bff','#6b45e6'],['photo','写真','#ff8fb1','#f2557f'],['clock','時計','#5a5a62','#2b2b30']];
  var dockApps=[['phone','','#5ee27a','#2bc24f'],['mail','','#4fa8ff','#0a6cf0'],['music','','#ff6a7c','#f0283f'],['sliders','','#a9abb2','#7c7e86']];
  for(i=0;i<gridApps.length;i++)$('#grid').appendChild(mk(gridApps[i],true));
  for(i=0;i<dockApps.length;i++)$('#dock').appendChild(mk(dockApps[i],false));

  /* analog clock */
  var an=$('#analog');
  for(i=0;i<60;i++){var t=document.createElement('div');t.className='tick'+(i%5?'':' big');t.style.transform='rotate('+(i*6)+'deg)';an.appendChild(t)}
  [[12,0],[3,90],[6,180],[9,270]].forEach(function(n){
    var e=document.createElement('div');e.className='num';e.textContent=n[0];
    var r=n[1]*Math.PI/180;e.style.left=(50+34*Math.sin(r))+'%';e.style.top=(50-34*Math.cos(r))+'%';an.appendChild(e);
  });
  var hh=document.createElement('div'),hm=document.createElement('div'),hs=document.createElement('div'),pin=document.createElement('div');
  hh.id='h-h';hm.id='h-m';hs.id='h-s';hh.className=hm.className=hs.className='hand';pin.className='pin';
  an.appendChild(hh);an.appendChild(hm);an.appendChild(hs);an.appendChild(pin);
  function pad(n){return n<10?'0'+n:''+n}
  function tick(){
    var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
    $('#c1').textContent=pad(h);$('#c2').textContent=pad(m);align();
    hh.style.transform='rotate('+((h%12)*30+m*.5)+'deg)';
    hm.style.transform='rotate('+(m*6+s*.1)+'deg)';
    hs.style.transform='rotate('+(s*6)+'deg)';
  }
  tick();setInterval(tick,1000);

  /* overlays */
  function openCC(){cc.classList.add('open');scrim.classList.add('open')}
  function openSheet(){sheet.classList.add('open');scrim.classList.add('open')}
  function closeAll(){cc.classList.remove('open');sheet.classList.remove('open');scrim.classList.remove('open')}
  function overlay(){return cc.classList.contains('open')||sheet.classList.contains('open')}

  /* gestures: top-right swipe down = Control Center / left-right = switch screen (finger-following)
     bottom-edge swipe up (clock screen) = apps / long-press clock = editor */
  function rub(dx){return((index===0&&dx>0)||(index===1&&dx<0))?dx*.3:dx}
  window.addEventListener('pointerdown',function(e){
    var x=e.clientX,y=e.clientY;
    if(overlay()){start={x:x,y:y,kind:'close',t:Date.now()};return}
    var kind='side';
    if(x>innerWidth*.7&&y<innerHeight*.18)kind='cc';
    else if(y>innerHeight*.85&&index===0)kind='bottom';
    start={x:x,y:y,kind:kind,t:Date.now(),lp:null};
    if(kind==='side'&&index===0){start.lp=setTimeout(function(){if(start&&!dragging){openSheet();start=null}},550)}
  });
  window.addEventListener('pointermove',function(e){
    if(!start)return;
    var dx=e.clientX-start.x,dy=e.clientY-start.y,ax=Math.abs(dx),ay=Math.abs(dy);
    if(start.lp&&(ax>10||ay>10)){clearTimeout(start.lp);start.lp=null}
    if(start.kind==='cc'){if(dy>50&&ay>ax){openCC();start=null}}
    else if(start.kind==='close'){
      if(cc.classList.contains('open')&&dy<-50&&ay>ax){closeAll();start=null}
      else if(sheet.classList.contains('open')&&dy>50&&ay>ax){closeAll();start=null}
    }
    else if(start.kind==='bottom'){if(dy<-50&&ay>ax){go(1);start=null}}
    else if(start.kind==='side'){
      if(!dragging&&ax>12&&ax>ay)dragging=true;
      if(dragging)setTrack(-index*W()+rub(dx),false);
    }
  });
  window.addEventListener('pointerup',function(e){
    if(start){
      if(start.lp)clearTimeout(start.lp);
      if(start.kind==='close'&&e.target===scrim)closeAll();
      if(dragging){
        var dx=e.clientX-start.x,v=Math.abs(dx)/Math.max(1,Date.now()-start.t);
        if(Math.abs(dx)>W()*.2||v>.5)go(index+(dx<0?1:-1));else go(index);
      }
    }
    dragging=false;start=null;
  });
  window.addEventListener('pointercancel',function(){if(dragging)go(index);dragging=false;start=null});

  /* touch feedback: squish + specular light that follows the finger */
  var lit=null;
  function light(e){if(!lit)return;var r=lit.getBoundingClientRect();lit.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');lit.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')}
  document.addEventListener('pointerdown',function(e){
    var t=e.target.closest?e.target.closest('.widget,.tile.tog,.app'):null;
    if(t){lit=t;t.classList.add('press');light(e)}
  });
  document.addEventListener('pointermove',light);
  function unlit(){if(lit){lit.classList.remove('press');lit=null}}
  document.addEventListener('pointerup',unlit);
  document.addEventListener('pointercancel',unlit);

  /* sliders */
  function slider(el,cb){
    var f=el.querySelector('.fill');
    function set(e){var r=el.getBoundingClientRect();var v=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));f.style.width=(v*100)+'%';cb(v)}
    el.addEventListener('pointerdown',function(e){e.stopPropagation();el.setPointerCapture(e.pointerId);set(e);el.onpointermove=set});
    el.addEventListener('pointerup',function(){el.onpointermove=null});
  }
  slider($('#sl-b'),function(v){$('#dim').style.opacity=(1-v)*.65});
  slider($('#sl-v'),function(){});
  $('#dim').style.opacity=.13;

  /* toggles */
  var tg=document.querySelectorAll('.tog');
  for(i=0;i<tg.length;i++)(function(el){el.addEventListener('click',function(){var on=el.classList.toggle('on');el.querySelector('.v').textContent=on?'オン':'オフ'})})(tg[i]);

  /* face editor */
  function setLayout(v){document.body.setAttribute('data-layout',v);if(v!=='analog')$('#clock').className=v;align()}
  var segs=document.querySelectorAll('.seg');
  for(i=0;i<segs.length;i++)(function(seg){
    var bs=seg.querySelectorAll('button'),k0=seg.getAttribute('data-k');
    for(var j=0;j<bs.length;j++)(function(b){b.addEventListener('click',function(){
      for(var k=0;k<bs.length;k++)bs[k].classList.remove('on');b.classList.add('on');
      var v=b.getAttribute('data-v');
      if(k0==='layout')setLayout(v);
      else if(k0==='font'){document.body.setAttribute('data-font',v);setTimeout(align,300)}
      else{root.style.setProperty('--wght',v);setTimeout(align,60)}
    })})(bs[j]);
  })(segs[i]);
  function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
  var sw=document.querySelectorAll('.sw i');
  for(i=0;i<sw.length;i++)(function(el){el.addEventListener('click',function(){
    for(var k=0;k<sw.length;k++)sw[k].classList.remove('on');el.classList.add('on');
    var c=el.getAttribute('data-c');
    if(c==='auto'){['--w1','--w2','--w3'].forEach(function(p){root.style.removeProperty(p)})}
    else{root.style.setProperty('--w1',hexA(c,.26));root.style.setProperty('--w2',hexA(c,.14));root.style.setProperty('--w3',hexA(c,.3))}
  })})(sw[i]);

  setTimeout(function(){$('#hint').style.opacity=0},5000);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){align()});
})();
</script>
</body>
</html>
